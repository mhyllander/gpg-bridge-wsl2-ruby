# Build Go executables and a Ruby package whenever a v* tag is created.

name: Create Release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: gpg_relay_go/go.mod
          cache-dependency-path: gpg_relay_go/go.mod

      - name: Build Go executables
        run: make -C gpg_relay_go all

      - name: Build Ruby tar.gz
        run: |
          tar zcf gpgrelay.tar.gz LICENSE \
            -C gpg_relay_ruby \
            relay.rb ssh_relay.rb gpg_relay_wsl.rb gpg_relay_win.rb \
            Gemfile Gemfile.lock README.md systemd

      - name: Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          body_path: ReleaseNotes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-pre') }}
          fail_on_unmatched_files: true
          files: |-
            gpgrelay.tar.gz
            gpg_relay_go/gpg_relay_wsl
            gpg_relay_go/gpg_relay_win.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
